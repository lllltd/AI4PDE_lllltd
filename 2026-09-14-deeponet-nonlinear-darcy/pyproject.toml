[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornell-deeponet-darcy"
version = "0.1.0"
description = "Reproducible 1D nonlinear Darcy and DeepONet tutorial project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
  "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
